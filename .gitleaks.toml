title = "Woobe gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives: literal negative-test credentials in test fixtures, not real secrets."
regexTarget = "match"
regexes = [
  # infra/terraform/modules/observability/tests/run-sync-tests.sh — asserts Grafana
  # rejects a WRONG password (401); "wrong" is the literal test value, not a credential.
  '''admin:wrong''',
]
paths = [
  # Same file: fall back to a path-level exclusion in case the finding spans a
  # different substring than the regex above anticipates.
  '''infra/terraform/modules/observability/tests/run-sync-tests\.sh''',
  # Root .env.example is a template file whose every value is an intentional
  # placeholder ("stub_replace_...", "dev-only-change-me-...") — never a real
  # secret, past or present. gitleaks scans full commit history (git log -p),
  # so an old commit's stub value (e.g. RAZORPAY_WEBHOOK_SECRET, changed since
  # but always a stub) still surfaces as a finding; excluded by path rather
  # than by pattern since new placeholder text is expected to keep changing.
  # Anchored to the root file only (gitleaks path regexes are unanchored
  # substring matches) so apps/web/.env.example and apps/admin/.env.example
  # stay fully scanned rather than being silently swept in too.
  '''^\.env\.example$''',
]
